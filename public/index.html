<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertix Labs</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=pt/">
  <link rel="alternate" hreflang="pt-BR" href="https://vertixlabs.netlify.app/pt/">
  <link rel="alternate" hreflang="en" href="https://vertixlabs.netlify.app/en/">
  <link rel="alternate" hreflang="x-default" href="https://vertixlabs.netlify.app/">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    html { background: #0a0c0b; color: #f3f6f4; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
    a { color: #0ee473; }
  </style>
  <script>
    (function () {
      var supported = ["pt", "en"];
      var lang = null;
      try { lang = localStorage.getItem("vx-lang"); } catch (e) { /* storage unavailable */ }
      if (supported.indexOf(lang) === -1) {
        var browser = (navigator.language || "").toLowerCase();
        lang = browser.indexOf("en") === 0 ? "en" : "pt";
      }
      location.replace(lang + "/" + location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="pt/">Português</a> <a href="en/">English</a></p>
</body>
</html>
